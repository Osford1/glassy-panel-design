name: validate

on:
  push:
  pull_request:

jobs:
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Glacier
        run: node tools/theme-contrast-check.mjs palettes/glacier.json
      - name: Validate Sunstone
        run: node tools/theme-contrast-check.mjs palettes/sunstone.json
